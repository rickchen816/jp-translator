<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極速雙向中日對講翻譯官</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: #f5f5f7; 
            color: #1d1d1f; 
            padding: 24px 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .card { 
            width: 100%; 
            max-width: 440px; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            padding: 28px 24px; 
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 { 
            font-size: 1.5rem; 
            font-weight: 600;
            text-align: center; 
            margin-bottom: 20px; 
            color: #1d1d1f; 
            letter-spacing: -0.015em;
        }

        .form-group { margin-bottom: 14px; }

        label { 
            font-size: 0.8rem; 
            font-weight: 600; 
            color: #86868b; 
            margin-bottom: 6px; 
            display: block; 
            letter-spacing: -0.01em;
        }

        input[type="password"], select, textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #d2d2d7; 
            border-radius: 12px; 
            font-size: 0.95rem; 
            outline: none; 
            background: #ffffff; 
            color: #1d1d1f;
            transition: all 0.2s ease;
        }

        input[type="password"]:focus, select:focus, textarea:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        textarea { height: 68px; resize: none; margin-bottom: 6px; line-height: 1.4; }

        /* Apple 風格對講大按鈕 */
        .btn-smart-mic {
            width: 100%; 
            height: 76px; 
            margin: 16px 0; 
            border: none; 
            border-radius: 18px;
            background: #0071e3; 
            color: #ffffff; 
            font-size: 1.15rem; 
            font-weight: 600;
            cursor: pointer; 
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            letter-spacing: -0.01em;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-smart-mic:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-smart-mic.recording { 
            background: linear-gradient(135deg, #ff3b30, #ff9500); 
            box-shadow: 0 4px 14px rgba(255, 59, 48, 0.3);
            animation: pulse 1.2s infinite; 
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.98); } }

        /* 結果顯示區塊 */
        .result-box { 
            padding: 16px; 
            background: #f5f5f7; 
            border-radius: 16px; 
            border: 1px solid #e5e5ea; 
            min-height: 90px; 
            margin-top: 10px; 
        }

        .detected-lang { 
            font-size: 0.8rem; 
            color: #0071e3; 
            font-weight: 600; 
            margin-bottom: 6px; 
            letter-spacing: -0.01em;
        }

        .result-text { 
            font-size: 1.2rem; 
            font-weight: 500; 
            color: #1d1d1f; 
            line-height: 1.45; 
            white-space: pre-wrap; 
            word-break: break-word; 
        }

        /* 輔助按鈕 */
        .action-btns { display: flex; gap: 10px; margin-top: 12px; }

        .btn-sec { 
            flex: 1; 
            padding: 11px; 
            background: #e8e8ed; 
            color: #1d1d1f; 
            border: none; 
            border-radius: 12px; 
            font-size: 0.88rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .btn-sec:active { background: #d1d1d6; }

        .btn-green { 
            background: #34c759; 
            color: #ffffff; 
            margin: 4px 0 12px 0; 
            width: 100%; 
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.2);
        }

        .btn-green:active { background: #28a745; }

        .tip-info { 
            font-size: 0.75rem; 
            color: #86868b; 
            margin-top: 14px; 
            text-align: center; 
            line-height: 1.3;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🇯🇵 智慧雙向中日對講翻譯官</h2>

    <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="貼上 API Key (AQ...)">
    </div>

    <div class="form-group">
        <label for="modelSelect">模型選擇</label>
        <select id="modelSelect">
            <option value="gemini-3.6-flash">gemini-3.6-flash (極速推薦)</option>
            <option value="gemini-3.5-flash">gemini-3.5-flash (穩定備用)</option>
        </select>
    </div>

    <button class="btn-smart-mic" id="micBtn" onclick="toggleRecording()">🎤 按一下說話（中/日皆可）</button>

    <div class="form-group">
        <label for="originalText">語音辨識原文（可手動修改）</label>
        <textarea id="originalText" placeholder="錄音完畢後，AI 聽到的原文會顯示在這裡..."></textarea>
        <button class="btn-sec btn-green" onclick="retranslateManual()">🔄 修正後重新翻譯並發音</button>
    </div>

    <div class="result-box">
        <div class="detected-lang" id="detectedLang">對話狀態：準備就緒</div>
        <div class="result-text" id="outputText">請按上方按鈕開始錄音...</div>
    </div>

    <div class="action-btns">
        <button class="btn-sec" onclick="speakResult()">🔊 重播語音</button>
        <button class="btn-sec" onclick="copyResult()">📋 複製結果</button>
    </div>

    <div class="tip-info">Designed for Apple Style ‧ 雙模型備援 ‧ 聲調辨識</div>
</div>

<script>
    let mediaRecorder = null, audioChunks = [], isRecording = false;
    let state = { text: "", langCode: "ja-JP", gender: "female", detected: "zh" };
    let systemVoices = [];

    document.addEventListener("DOMContentLoaded", () => {
        ["gemini_api_key", "gemini_model"].forEach(k => {
            const v = localStorage.getItem(k);
            if (v) document.getElementById(k === "gemini_api_key" ? "apiKey" : "modelSelect").value = v;
        });
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    });

    function loadVoices() { systemVoices = window.speechSynthesis.getVoices(); }
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function fetchGemini(apiKey, primaryModel, body) {
        const models = [...new Set([primaryModel, "gemini-3.6-flash", "gemini-3.5-flash"])];
        for (let m of models) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`;
            for (let i = 0; i < 2; i++) {
                try {
                    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
                    const data = await res.json();
                    if (res.ok && data.candidates?.[0]?.content) return data;
                    if (data.error && (data.error.code === 429 || data.error.message.includes("quota"))) {
                        await delay(1200); continue;
                    }
                    throw new Error(data.error?.message || "API 錯誤");
                } catch (e) {
                    if (i === 1 && m === models[models.length - 1]) throw e;
                }
            }
        }
        throw new Error("伺服器繁忙，請稍等 3~5 秒後重試。");
    }

    async function toggleRecording() {
        const micBtn = document.getElementById("micBtn");
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    await processAudio(blob);
                };
                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add("recording");
                micBtn.innerText = "🛑 正在聆聽...（講完再按一下）";
                document.getElementById("detectedLang").innerText = "錄音中...";
                document.getElementById("outputText").innerText = "正在錄下對話...";
            } catch (err) { alert("存取麥克風失敗：" + err.message); }
        } else {
            isRecording = false;
            micBtn.classList.remove("recording");
            micBtn.innerText = "⏳ 辨識與翻譯中...";
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
        }
    }

    async function processAudio(blob) {
        const apiKey = document.getElementById("apiKey").value.trim();
        const model = document.getElementById("modelSelect").value;
        if (!apiKey) { alert("請貼上 API Key！"); resetMicBtn(); return; }

        localStorage.setItem("gemini_api_key", apiKey);
        localStorage.setItem("gemini_model", model);

        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = async () => {
            const base64 = reader.result.split(',')[1];
            const prompt = `專業中日即時翻譯任務：
1. 性別判斷："male" 或 "female"
2. 文字轉寫：完整內容填入 "original"
3. 翻譯：中文 ➔ 禮貌日文(丁寧語)；日文 ➔ 繁體中文
僅輸出 JSON：{"gender":"male","detected":"zh","original":"..","translation":".."}`;

            try {
                const data = await fetchGemini(apiKey, model, { contents: [{ parts: [{ inline_data: { mime_type: blob.type || "audio/webm", data: base64 } }, { text: prompt }] }] });
                let raw = data.candidates[0].content.parts[0].text.trim().replace(/```json/g, "").replace(/```/g, "").trim();
                const parsed = JSON.parse(raw);

                state.text = parsed.translation;
                state.gender = parsed.gender || "female";
                state.detected = parsed.detected;

                document.getElementById("originalText").value = parsed.original;
                updateResultUI();
            } catch (err) {
                document.getElementById("outputText").innerText = "翻譯失敗：" + err.message;
            } finally { resetMicBtn(); }
        };
    }

    async function retranslateManual() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const model = document.getElementById("modelSelect").value;
        const text = document.getElementById("originalText").value.trim();
        if (!text) return alert("原文框無文字！");

        document.getElementById("outputText").innerText = "重新翻譯中...";
        const prompt = state.detected === "zh" 
            ? `將以下中文譯為禮貌日文（丁寧語），直接提供結果：\n${text}`
            : `將以下日文譯為繁體中文，直接提供結果：\n${text}`;

        try {
            const data = await fetchGemini(apiKey, model, { contents: [{ parts: [{ text: prompt }] }] });
            state.text = data.candidates[0].content.parts[0].text.trim();
            updateResultUI();
        } catch (err) {
            document.getElementById("outputText").innerText = "連線失敗：" + err.message;
        }
    }

    function updateResultUI() {
        const isZh = state.detected === "zh";
        const genderTag = state.gender === "male" ? "👨 男聲" : "👩 女聲";
        state.langCode = isZh ? "ja-JP" : "zh-TW";
        document.getElementById("detectedLang").innerText = `偵測到：【${isZh ? "中文" : "日文"} (${genderTag})】 ➔ 譯為${isZh ? "日文" : "繁體中文"}：`;
        document.getElementById("outputText").innerText = state.text;
        speakText(state.text, state.langCode, state.gender);
    }

    function resetMicBtn() {
        const btn = document.getElementById("micBtn");
        btn.classList.remove("recording");
        btn.innerText = "🎤 按一下說話（中/日皆可）";
    }

    function speakText(text, lang, gender) {
        if (!text) return;
        window.speechSynthesis.cancel();

        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        u.pitch = gender === 'male' ? 0.75 : 1.1;
        u.rate = gender === 'male' ? 0.85 : 0.9;

        if (!systemVoices.length) systemVoices = window.speechSynthesis.getVoices();
        const prefix = lang.split('-')[0];
        const match = systemVoices.find(v => {
            if (!v.lang.toLowerCase().replace('_', '-').startsWith(prefix)) return false;
            const n = v.name.toLowerCase();
            return gender === 'male' ? (n.includes('male') || n.includes('男') || n.includes('otoya') || n.includes('ichiro'))
                                     : (n.includes('female') || n.includes('女') || n.includes('kyoko') || n.includes('o-ren'));
        });

        if (match) u.voice = match;
        window.speechSynthesis.speak(u);
    }

    function speakResult() { if (state.text) speakText(state.text, state.langCode, state.gender); }
    function copyResult() { if (state.text) navigator.clipboard.writeText(state.text).then(() => alert("已複製！")); }
</script>

</body>
</html>
