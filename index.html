<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隨身日文翻譯官</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f2f2f7; color: #1c1c1e; padding: 16px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); }
        h2 { font-size: 1.4rem; text-align: center; margin-bottom: 16px; color: #2c3e50; }
        .api-key-group { margin-bottom: 16px; }
        label { font-size: 0.85rem; font-weight: 600; color: #6c757d; margin-bottom: 6px; display: block; }
        input[type="password"], textarea { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 12px; font-size: 1rem; outline: none; }
        input[type="password"]:focus, textarea:focus { border-color: #007aff; }
        textarea { height: 100px; resize: none; margin-bottom: 12px; }
        .btn-primary { width: 100%; padding: 14px; background-color: #007aff; color: #ffffff; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-box { margin-top: 20px; padding: 16px; background-color: #f8f9fa; border-radius: 12px; border: 1px solid #e5e5ea; min-height: 100px; }
        .result-text { font-size: 1.25rem; font-weight: 500; color: #000000; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .action-btns { display: flex; gap: 10px; margin-top: 12px; }
        .btn-secondary { flex: 1; padding: 10px; background-color: #e5e5ea; color: #1c1c1e; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .btn-speak { background-color: #34c759; color: #ffffff; }
    </style>
</head>
<body>

<div class="card">
    <h2>🇯🇵 隨身日文翻譯官</h2>

    <div class="api-key-group">
        <label for="apiKey">Gemini API Key：</label>
        <input type="password" id="apiKey" placeholder="請貼上你的 API Key">
    </div>

    <textarea id="inputText" placeholder="請輸入中文...（例如：請問這附近有超商嗎？）"></textarea>

    <button class="btn-primary" onclick="translateText()" id="submitBtn">翻譯成日文</button>

    <div class="result-box">
        <label>日文翻譯結果（禮貌敬語）：</label>
        <div class="result-text" id="outputText">等待輸入中...</div>
    </div>

    <div class="action-btns">
        <button class="btn-secondary btn-speak" onclick="speakJapanese()">🔊 語音發音</button>
        <button class="btn-secondary" onclick="copyResult()">📋 複製日文</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
        }
    });

    async function translateText() {
        const API_KEY = document.getElementById("apiKey").value.trim();
        const input = document.getElementById("inputText").value.trim();
        const output = document.getElementById("outputText");
        const btn = document.getElementById("submitBtn");

        if (!API_KEY) {
            alert("請貼上你的 API Key！");
            return;
        }

        if (!input) {
            alert("請輸入要翻譯的文字！");
            return;
        }

        localStorage.setItem("gemini_api_key", API_KEY);

        output.innerText = "翻譯中...";
        btn.disabled = true;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
        
        const requestBody = {
            contents: [{
                parts: [{
                    text: `請將以下中文內容翻譯成適合在日本旅遊日常使用的禮貌敬語（丁寧語，如～です、～ます）。請直接提供日文翻譯結果即可，不需要包含任何中文解釋、注音或引號：\n\n${input}`
                }]
            }]
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                output.innerText = data.candidates[0].content.parts[0].text.trim();
            } else {
                if (data.error) {
                    output.innerText = `API 錯誤 (${data.error.code})：${data.error.message}`;
                } else {
                    output.innerText = "翻譯失敗，請確認網路或重新複製 API Key。";
                }
            }
        } catch (error) {
            output.innerText = "連線失敗：" + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    function speakJapanese() {
        const text = document.getElementById("outputText").innerText;
        if (!text || text === "等待輸入中..." || text.startsWith("API 錯誤") || text.startsWith("連線失敗")) return;

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ja-JP";
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function copyResult() {
        const text = document.getElementById("outputText").innerText;
        if (!text || text === "等待輸入中...") return;

        navigator.clipboard.writeText(text).then(() => {
            alert("已成功複製日文！");
        }).catch(err => {
            alert("複製失敗：" + err);
        });
    }
</script>

</body>
</html>
