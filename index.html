<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>極速雙向日文翻譯官</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f2f2f7; color: #1c1c1e; padding: 16px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); }
        h2 { font-size: 1.4rem; text-align: center; margin-bottom: 14px; color: #2c3e50; }
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.85rem; font-weight: 600; color: #6c757d; margin-bottom: 4px; display: block; }
        input[type="password"], select { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 12px; font-size: 1rem; outline: none; background: #fff; }
        
        /* 超大一鍵對講按鈕 */
        .btn-smart-mic {
            width: 100%;
            height: 90px;
            margin: 16px 0;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-smart-mic.recording {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            animation: pulse 1.2s infinite;
            box-shadow: 0 6px 16px rgba(255, 59, 48, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }

        .result-box { padding: 16px; background-color: #f8f9fa; border-radius: 14px; border: 1px solid #e5e5ea; min-height: 110px; margin-top: 10px; }
        .detected-lang { font-size: 0.8rem; color: #007aff; font-weight: 600; margin-bottom: 4px; }
        .result-text { font-size: 1.25rem; font-weight: 500; color: #000000; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .action-btns { display: flex; gap: 10px; margin-top: 12px; }
        .btn-secondary { flex: 1; padding: 10px; background-color: #e5e5ea; color: #1c1c1e; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .tip-info { font-size: 0.8rem; color: #8e8e93; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ 智慧雙向對講翻譯官</h2>

    <div class="form-group">
        <label for="apiKey">Gemini API Key：</label>
        <input type="password" id="apiKey" placeholder="貼上 API Key (AQ...)">
    </div>

    <div class="form-group">
        <label for="modelSelect">模型選擇：</label>
        <select id="modelSelect">
            <option value="gemini-3.6-flash">gemini-3.6-flash (多模態語音首選)</option>
            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        </select>
    </div>

    <!-- 智慧對講按鈕 -->
    <button class="btn-smart-mic" id="micBtn" onclick="toggleRecording()">
        🎤 按一下說話（中/日皆可）
    </button>

    <div class="result-box">
        <div class="detected-lang" id="detectedLang">對話狀態：準備就緒</div>
        <div class="result-text" id="outputText">請按上方按鈕開始錄音...</div>
    </div>

    <div class="action-btns">
        <button class="btn-secondary" onclick="speakResult()">🔊 重播語音</button>
        <button class="btn-secondary" onclick="copyResult()">📋 複製結果</button>
    </div>

    <div class="tip-info">💡 按一下開始錄音，講完再按一下結束，AI 會自動判定語言並雙向翻譯！</div>
</div>

<script>
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let lastTranslatedText = "";
    let lastTargetLang = "";

    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) document.getElementById("apiKey").value = savedKey;

        const savedModel = localStorage.getItem("gemini_model");
        if (savedModel) document.getElementById("modelSelect").value = savedModel;
    });

    async function toggleRecording() {
        const micBtn = document.getElementById("micBtn");

        if (!isRecording) {
            // 開始錄音
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await processAudioTranslation(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add("recording");
                micBtn.innerText = "🛑 正在聆聽...（講完再按一下）";
                document.getElementById("detectedLang").innerText = "錄音中...";
                document.getElementById("outputText").innerText = "正在錄下對話...";
            } catch (err) {
                alert("無法存取麥克風，請確保已允許存取麥克風權限！錯誤：" + err.message);
            }
        } else {
            // 結束錄音
            isRecording = false;
            micBtn.classList.remove("recording");
            micBtn.innerText = "⏳ AI 判斷並翻譯中...";
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
    }

    async function processAudioTranslation(audioBlob) {
        const API_KEY = document.getElementById("apiKey").value.trim();
        const selectedModel = document.getElementById("modelSelect").value;
        const micBtn = document.getElementById("micBtn");
        const statusLabel = document.getElementById("detectedLang");
        const output = document.getElementById("outputText");

        if (!API_KEY) {
            alert("請先貼上 API Key！");
            resetMicBtn();
            return;
        }

        localStorage.setItem("gemini_api_key", API_KEY);
        localStorage.setItem("gemini_model", selectedModel);

        // 將語音檔轉成 Base64
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];

            const promptText = `你是一個專業的中日雙向即時翻譯官。請聽這段語音音訊：
1. 如果說話者使用的是【中文】：請將其翻譯成適合日本旅遊使用的禮貌敬語【日文】（丁寧語）。
2. 如果說話者使用的是【日文】：請將其翻譯成【繁體中文】。
3. 請嚴格按照以下 JSON 格式回答，不要加上任何 Markdown 標籤或額外文字：
{"detected": "zh", "translation": "翻譯後的文字"}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${API_KEY}`;

            const requestBody = {
                contents: [{
                    parts: [
                        { inline_data: { mime_type: "audio/webm", data: base64Audio } },
                        { text: promptText }
                    ]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    let rawText = data.candidates[0].content.parts[0].text.trim();
                    // 清理可能包含的 Markdown JSON 標記
                    rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();

                    const parsed = JSON.parse(rawText);
                    lastTranslatedText = parsed.translation;

                    if (parsed.detected === "zh") {
                        statusLabel.innerText = "偵測到【中文】 ➔ 已譯為日文（自動發音）：";
                        lastTargetLang = "ja-JP";
                        output.innerText = lastTranslatedText;
                        speakText(lastTranslatedText, "ja-JP"); // 聽到中文自動朗讀日文給店家聽
                    } else {
                        statusLabel.innerText = "偵測到【日文】 ➔ 已譯為繁體中文：";
                        lastTargetLang = "zh-TW";
                        output.innerText = lastTranslatedText;
                    }
                } else {
                    output.innerText = "翻譯失敗：" + (data.error ? data.error.message : "無法辨識語音內容。");
                }
            } catch (error) {
                output.innerText = "解析失敗：" + error.message;
            } finally {
                resetMicBtn();
            }
        };
    }

    function resetMicBtn() {
        const micBtn = document.getElementById("micBtn");
        micBtn.classList.remove("recording");
        micBtn.innerText = "🎤 按一下說話（中/日皆可）";
    }

    function speakText(text, lang) {
        if (!text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function speakResult() {
        if (lastTranslatedText) {
            speakText(lastTranslatedText, lastTargetLang);
        }
    }

    function copyResult() {
        if (lastTranslatedText) {
            navigator.clipboard.writeText(lastTranslatedText).then(() => alert("已複製！"));
        }
    }
</script>

</body>
</html>
