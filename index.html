<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>日文口說翻譯官</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --border: #2e2e3a;
      --primary: #e63946;
      --primary-glow: rgba(230,57,70,0.35);
      --jp: #ff6b6b;
      --zh: #4ecdc4;
      --text: #f0f0f5;
      --text-muted: #6b6b80;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans TC', 'Noto Sans JP', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    header {
      width: 100%;
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .app-title span { color: var(--jp); }

    .settings-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px 32px;
      gap: 20px;
    }

    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 20px;
      width: 100%;
      justify-content: center;
    }

    .lang-name {
      font-size: 15px;
      font-weight: 600;
      min-width: 90px;
      text-align: center;
    }

    #srcLang { color: var(--jp); }
    #dstLang { color: var(--zh); }

    .swap-btn {
      background: var(--border);
      border: none;
      color: var(--text);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .swap-btn:hover { background: #3e3e50; }

    .cards {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      min-height: 80px;
      position: relative;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .card-label.jp { color: var(--jp); }
    .card-label.zh { color: var(--zh); }

    .card-text {
      font-size: 20px;
      line-height: 1.6;
      min-height: 36px;
      color: var(--text);
      word-break: break-all;
    }

    .card-text.placeholder { color: var(--text-muted); font-size: 15px; }
    .card-text.listening { color: var(--jp); }

    .copy-mini {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      display: none;
    }

    .card:hover .copy-mini { display: block; }

    .visualizer {
      width: 100%;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .visualizer.active { opacity: 1; }

    .bar {
      width: 4px;
      border-radius: 2px;
      background: var(--jp);
      animation: wave 0.8s ease-in-out infinite;
      height: 8px;
    }

    .bar:nth-child(1) { animation-delay: 0.0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }
    .bar:nth-child(6) { animation-delay: 0.3s; }
    .bar:nth-child(7) { animation-delay: 0.2s; }
    .bar:nth-child(8) { animation-delay: 0.1s; }
    .bar:nth-child(9) { animation-delay: 0.0s; }

    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 36px; }
    }

    .ptt-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .ptt-hint {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    .ptt-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 40% 35%, #e63946, #9b1c28);
      box-shadow: 0 0 0 0 var(--primary-glow);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, box-shadow 0.3s;
      touch-action: none;
    }

    .ptt-btn:hover { transform: scale(1.03); }

    .ptt-btn.pressed {
      transform: scale(0.94);
      box-shadow: 0 0 0 24px var(--primary-glow);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 12px var(--primary-glow); }
      50% { box-shadow: 0 0 0 28px rgba(230,57,70,0.1); }
    }

    .ptt-icon { font-size: 40px; }
    .ptt-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.85);
    }

    .status {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      height: 20px;
    }

    .status.recording { color: var(--jp); }
    .status.translating { color: var(--zh); }

    .history { width: 100%; }

    .history-title {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .history-item .orig { color: var(--text-muted); margin-bottom: 2px; }
    .history-item .trans { color: var(--text); }

    .settings-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .settings-panel.open { display: flex; }

    .settings-box {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 24px 24px 40px;
      width: 100%;
      max-width: 480px;
    }

    .settings-box h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 16px; }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .field input:focus { border-color: var(--primary); }

    .close-settings {
      width: 100%;
      background: var(--primary);
      border: none;
      color: white;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .error-bar {
      display: none;
      width: 100%;
      background: #3d1515;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #fca5a5;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      transition: transform 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <div class="app-title"><span>日文</span> 口說翻譯官</div>
  <button class="settings-btn" onclick="openSettings()">⚙ 設定</button>
</header>

<main>
  <div class="lang-toggle">
    <span class="lang-name" id="srcLang">🇯🇵 日文</span>
    <button class="swap-btn" id="swapBtn" title="交換語言">⇄</button>
    <span class="lang-name" id="dstLang">🇹🇼 繁中</span>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-label jp" id="srcCardLabel">說的話</div>
      <div class="card-text placeholder" id="srcDisplay">按住下方按鈕開始說話…</div>
      <button class="copy-mini" onclick="copyText('src')">複製</button>
    </div>
    <div class="card">
      <div class="card-label zh" id="dstCardLabel">翻譯結果</div>
      <div class="card-text placeholder" id="dstDisplay">翻譯結果會出現在這裡…</div>
      <button class="copy-mini" onclick="copyText('dst')">複製</button>
    </div>
  </div>

  <div class="visualizer" id="viz">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="ptt-wrap">
    <div class="ptt-hint">按住說話，放開翻譯</div>
    <button class="ptt-btn" id="pttBtn"
      onmousedown="startRec(event)" onmouseup="stopRec(event)"
      ontouchstart="startRec(event)" ontouchend="stopRec(event)">
      <span class="ptt-icon">🎙</span>
      <span class="ptt-label" id="pttLabel">按住說話</span>
    </button>
    <div class="status" id="status">就緒</div>
  </div>

  <div class="error-bar" id="errorBar"></div>

  <div class="history" id="historyWrap" style="display:none">
    <div class="history-title">歷史記錄</div>
    <div class="history-list" id="historyList"></div>
  </div>
</main>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-box">
    <h3>⚙ 設定</h3>
    <div class="field">
      <label>Gemini API Key</label>
      <input type="password" id="apiKeyInput" placeholder="AIza…（空白則使用內建 Key）" />
    </div>
    <div class="field">
      <label>語音朗讀速度（0.5 ～ 2.0）</label>
      <input type="number" id="ttsRate" value="1.0" min="0.5" max="2.0" step="0.1" />
    </div>
    <button class="close-settings" onclick="closeSettings()">完成</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ──────────────────────────────────────────────
  //  ⚙️  填入你的 Gemini API Key
  // ──────────────────────────────────────────────
  const BUILT_IN_KEY = "AIzaSyCJfN1YbcC-S8I2tmrNMxGiIfrlQxBgj_U";
  // ──────────────────────────────────────────────

  const GEMINI_MODEL = "gemini-2.0-flash";

  let isJpToZh = true;
  let recognition = null;
  let isRecording = false;
  let pendingTranscript = "";
  let history = [];

  const pttBtn     = document.getElementById("pttBtn");
  const pttLabel   = document.getElementById("pttLabel");
  const statusEl   = document.getElementById("status");
  const srcDisplay = document.getElementById("srcDisplay");
  const dstDisplay = document.getElementById("dstDisplay");
  const srcCardLabel = document.getElementById("srcCardLabel");
  const dstCardLabel = document.getElementById("dstCardLabel");
  const srcLang    = document.getElementById("srcLang");
  const dstLang    = document.getElementById("dstLang");
  const viz        = document.getElementById("viz");
  const errorBar   = document.getElementById("errorBar");

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showError("你的瀏覽器不支援語音辨識，請使用 Chrome 或 Edge。");
    pttBtn.disabled = true;
  }

  function buildRecognition() {
    const r = new SpeechRecognition();
    r.continuous = false;
    r.interimResults = true;
    r.lang = isJpToZh ? "ja-JP" : "zh-TW";

    r.onresult = (e) => {
      let interim = "", final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      const display = final || interim;
      if (display) {
        srcDisplay.className = "card-text listening";
        srcDisplay.textContent = display;
        pendingTranscript = display;
      }
    };

    r.onerror = (e) => {
      if (e.error === "no-speech") return;
      if (e.error === "not-allowed") {
        showError("麥克風權限被拒絕，請在瀏覽器設定中允許麥克風。");
      } else {
        showError("語音辨識錯誤：" + e.error);
      }
      stopVisualize();
    };

    r.onend = () => {
      if (isRecording) {
        try { r.start(); } catch(_) {}
      }
    };

    return r;
  }

  function startRec(e) {
    e.preventDefault();
    if (isRecording) return;
    isRecording = true;

    pendingTranscript = "";
    srcDisplay.className = "card-text listening";
    srcDisplay.textContent = "聆聽中…";
    dstDisplay.className = "card-text placeholder";
    dstDisplay.textContent = "翻譯結果會出現在這裡…";
    errorBar.style.display = "none";

    pttBtn.classList.add("pressed");
    pttLabel.textContent = "放開翻譯";
    setStatus("🔴 錄音中…", "recording");
    startVisualize();

    recognition = buildRecognition();
    try { recognition.start(); } catch(err) { showError(err.message); }
  }

  function stopRec(e) {
    e.preventDefault();
    if (!isRecording) return;
    isRecording = false;

    pttBtn.classList.remove("pressed");
    pttLabel.textContent = "按住說話";
    stopVisualize();

    if (recognition) {
      recognition.onend = null;
      try { recognition.stop(); } catch(_) {}
      recognition = null;
    }

    const text = pendingTranscript.trim();
    if (text) {
      setStatus("⏳ 翻譯中…", "translating");
      srcDisplay.className = "card-text";
      srcDisplay.textContent = text;
      translateText(text);
    } else {
      setStatus("就緒", "");
    }
  }

  async function translateText(text) {
    const userKey = document.getElementById("apiKeyInput").value.trim();
    const apiKey = userKey || BUILT_IN_KEY;

    if (!apiKey || apiKey === "YOUR_GEMINI_API_KEY_HERE") {
      showError("請在設定中填入 Gemini API Key");
      setStatus("就緒", "");
      return;
    }

    const srcLangName = isJpToZh ? "日文" : "繁體中文";
    const dstLangName = isJpToZh ? "繁體中文" : "日文";
    const prompt = `你是專業口譯員。請將以下${srcLangName}翻譯成${dstLangName}，只輸出翻譯結果，不加任何解釋。\n\n${text}`;

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.1, maxOutputTokens: 1024 }
          })
        }
      );

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const result = (data?.candidates?.[0]?.content?.parts?.[0]?.text ?? "").trim();

      dstDisplay.className = "card-text";
      dstDisplay.textContent = result;
      setStatus("✅ 翻譯完成", "");

      speak(result, isJpToZh ? "zh-TW" : "ja-JP");
      addHistory(text, result);

    } catch (err) {
      showError("翻譯失敗：" + err.message);
      setStatus("就緒", "");
    }
  }

  function speak(text, lang) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = lang;
    const rate = parseFloat(document.getElementById("ttsRate").value) || 1.0;
    utt.rate = rate;
    const voices = speechSynthesis.getVoices();
    const match = voices.find(v => v.lang.startsWith(lang.slice(0,2)));
    if (match) utt.voice = match;
    speechSynthesis.speak(utt);
  }

  if (window.speechSynthesis) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  document.getElementById("swapBtn").onclick = () => {
    isJpToZh = !isJpToZh;
    srcLang.textContent = isJpToZh ? "🇯🇵 日文" : "🇹🇼 繁中";
    dstLang.textContent = isJpToZh ? "🇹🇼 繁中" : "🇯🇵 日文";
    srcDisplay.className = "card-text placeholder";
    srcDisplay.textContent = "按住下方按鈕開始說話…";
    dstDisplay.className = "card-text placeholder";
    dstDisplay.textContent = "翻譯結果會出現在這裡…";
    setStatus("就緒", "");
  };

  function addHistory(orig, trans) {
    history.unshift({ orig, trans });
    if (history.length > 10) history.pop();
    const wrap = document.getElementById("historyWrap");
    const list = document.getElementById("historyList");
    wrap.style.display = "block";
    list.innerHTML = history.map(h => `
      <div class="history-item">
        <div class="orig">${escHtml(h.orig)}</div>
        <div class="trans">${escHtml(h.trans)}</div>
      </div>
    `).join("");
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = "status " + cls;
  }

  function showError(msg) {
    errorBar.textContent = "⚠️ " + msg;
    errorBar.style.display = "block";
  }

  function startVisualize() { viz.classList.add("active"); }
  function stopVisualize()  { viz.classList.remove("active"); }

  function copyText(side) {
    const el = side === "src" ? srcDisplay : dstDisplay;
    if (el.classList.contains("placeholder")) return;
    navigator.clipboard.writeText(el.textContent).then(() => showToast("已複製"));
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function openSettings()  { document.getElementById("settingsPanel").classList.add("open"); }
  function closeSettings() { document.getElementById("settingsPanel").classList.remove("open"); }

  document.getElementById("settingsPanel").addEventListener("click", e => {
    if (e.target === document.getElementById("settingsPanel")) closeSettings();
  });

  pttBtn.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
