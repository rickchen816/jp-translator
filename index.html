
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萬用多國語音對講翻譯官</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f2f2f7; color: #1c1c1e; padding: 16px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); }
        h2 { font-size: 1.4rem; text-align: center; margin-bottom: 14px; color: #2c3e50; }
        .form-group { margin-bottom: 10px; }
        label { font-size: 0.85rem; font-weight: 600; color: #6c757d; margin-bottom: 4px; display: block; }
        input[type="password"], select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d1d6; border-radius: 12px; font-size: 1rem; outline: none; background: #fff; }
        
        /* 超大一鍵對講按鈕 */
        .btn-smart-mic {
            width: 100%;
            height: 80px;
            margin: 12px 0;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-smart-mic.recording {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            animation: pulse 1.2s infinite;
            box-shadow: 0 6px 16px rgba(255, 59, 48, 0.35);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }

        textarea { height: 60px; resize: none; margin-bottom: 6px; }

        .result-box { padding: 14px; background-color: #f8f9fa; border-radius: 14px; border: 1px solid #e5e5ea; min-height: 90px; margin-top: 10px; }
        .detected-lang { font-size: 0.85rem; color: #007aff; font-weight: 600; margin-bottom: 6px; }
        .result-text { font-size: 1.25rem; font-weight: 500; color: #000000; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .btn-secondary { flex: 1; padding: 10px; background-color: #e5e5ea; color: #1c1c1e; border: none; border-radius: 10px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
        .btn-retranslate { background-color: #34c759; color: white; margin-top: 4px; margin-bottom: 12px; }
        .tip-info { font-size: 0.8rem; color: #8e8e93; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌐 萬用多國語音對講翻譯官</h2>

    <div class="form-group">
        <label for="apiKey">Gemini API Key：</label>
        <input type="password" id="apiKey" placeholder="貼上 API Key (AQ...)">
    </div>

    <!-- 選擇對話的外國語言 -->
    <div class="form-group">
        <label for="targetLangSelect">對方使用的語言（翻譯目標）：</label>
        <select id="targetLangSelect">
            <option value="ja">🇯🇵 日本語 (Japanese)</option>
            <option value="en">🇺🇸 美語 (English - US)</option>
            <option value="ko">🇰🇷 韓語 (Korean)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="modelSelect">模型選擇：</label>
        <select id="modelSelect">
            <option value="gemini-3.6-flash">gemini-3.6-flash (多模態語音首選)</option>
            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        </select>
    </div>

    <!-- 智慧對講按鈕 -->
    <button class="btn-smart-mic" id="micBtn" onclick="toggleRecording()">
        🎤 按一下說話（中文與外語皆可）
    </button>

    <!-- 語音辨識原文視窗 (可編輯) -->
    <div class="form-group">
        <label for="originalText" id="originalLabel">語音辨識原文（若有錯可在此手動修改）：</label>
        <textarea id="originalText" placeholder="錄音完畢後，AI 聽到的原文會顯示在這裡..."></textarea>
        <button class="btn-secondary btn-retranslate" style="width:100%" onclick="retranslateManual()">🔄 修正後重新翻譯並發音</button>
    </div>

    <!-- 翻譯結果視窗 -->
    <div class="result-box">
        <div class="detected-lang" id="detectedLang">對話狀態：準備就緒</div>
        <div class="result-text" id="outputText">請按上方按鈕開始錄音...</div>
    </div>

    <div class="action-btns">
        <button class="btn-secondary" onclick="speakResult()">🔊 重播語音</button>
        <button class="btn-secondary" onclick="copyResult()">📋 複製結果</button>
    </div>

    <div class="tip-info">💡 選擇目標外語後按下錄音，講中文或外語皆可自動對講！</div>
</div>

<script>
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let lastTranslatedText = "";
    let lastTargetLangCode = "ja-JP"; // 發音語言代碼
    let lastDetectedGender = "female"; 
    let lastDetectedLang = "zh";
    let systemVoices = [];

    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("gemini_api_key");
        if (savedKey) document.getElementById("apiKey").value = savedKey;

        const savedModel = localStorage.getItem("gemini_model");
        if (savedModel) document.getElementById("modelSelect").value = savedModel;

        const savedLang = localStorage.getItem("target_lang");
        if (savedLang) document.getElementById("targetLangSelect").value = savedLang;

        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
    });

    function loadVoices() {
        systemVoices = window.speechSynthesis.getVoices();
    }

    async function toggleRecording() {
        const micBtn = document.getElementById("micBtn");

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await processAudioTranslation(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add("recording");
                micBtn.innerText = "🛑 正在聆聽...（講完再按一下）";
                document.getElementById("detectedLang").innerText = "錄音中...";
                document.getElementById("outputText").innerText = "正在錄下對話...";
            } catch (err) {
                alert("無法存取麥克風，請確保已允許存取麥克風權限！錯誤：" + err.message);
            }
        } else {
            isRecording = false;
            micBtn.classList.remove("recording");
            micBtn.innerText = "⏳ AI 聲學辨識與翻譯中...";
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
    }

    async function processAudioTranslation(audioBlob) {
        const API_KEY = document.getElementById("apiKey").value.trim();
        const selectedModel = document.getElementById("modelSelect").value;
        const targetLang = document.getElementById("targetLangSelect").value; // ja, en, ko
        const statusLabel = document.getElementById("detectedLang");
        const output = document.getElementById("outputText");
        const originalInput = document.getElementById("originalText");

        if (!API_KEY) {
            alert("請先貼上 API Key！");
            resetMicBtn();
            return;
        }

        localStorage.setItem("gemini_api_key", API_KEY);
        localStorage.setItem("gemini_model", selectedModel);
        localStorage.setItem("target_lang", targetLang);

        const langNameMap = { ja: "日文", en: "美式英文", ko: "韓文" };
        const selectedLangName = langNameMap[targetLang];

        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];

            const promptText = `你是一個專業的多國語言雙向即時翻譯官，並且具備聲學辨識能力。請仔細聽這段語音音訊：
1. 【性別辨識】：分析說話者的音色與頻率，判斷說話者是男性("male")還是女性("female")。
2. 【語音轉文字】：將聽到的內容完整寫出 ("original")。
3. 【語言與翻譯】：
   - 如果說話者講的是【中文】：翻譯成適合日常旅遊使用的禮貌【${selectedLangName}】。
   - 如果說話者講的是【外語 (${selectedLangName}或任何外語)】：翻譯成【繁體中文】。
4. 請嚴格按照以下 JSON 格式回答，不要加任何 Markdown 標記：
{"gender": "male", "detected": "zh", "original": "聽到的原文", "translation": "翻譯後的內容"}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${API_KEY}`;

            const requestBody = {
                contents: [{
                    parts: [
                        { inline_data: { mime_type: "audio/webm", data: base64Audio } },
                        { text: promptText }
                    ]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    let rawText = data.candidates[0].content.parts[0].text.trim();
                    rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();

                    const parsed = JSON.parse(rawText);
                    lastTranslatedText = parsed.translation;
                    lastDetectedGender = parsed.gender; 
                    lastDetectedLang = parsed.detected;

                    originalInput.value = parsed.original;

                    const genderTag = lastDetectedGender === "male" ? "👨 男聲" : "👩 女聲";

                    if (parsed.detected === "zh") {
                        statusLabel.innerText = `偵測到：【中文 (${genderTag})】 ➔ 譯為${selectedLangName}：`;
                        
                        // 設定對應外語的 Voice Code
                        if (targetLang === 'ja') lastTargetLangCode = 'ja-JP';
                        else if (targetLang === 'en') lastTargetLangCode = 'en-US';
                        else if (targetLang === 'ko') lastTargetLangCode = 'ko-KR';

                        output.innerText = lastTranslatedText;
                        speakText(lastTranslatedText, lastTargetLangCode, lastDetectedGender);
                    } else {
                        statusLabel.innerText = `偵測到：【外語 (${genderTag})】 ➔ 譯為繁體中文：`;
                        lastTargetLangCode = "zh-TW";
                        output.innerText = lastTranslatedText;
                        speakText(lastTranslatedText, "zh-TW", lastDetectedGender);
                    }
                } else {
                    output.innerText = "翻譯失敗：" + (data.error ? data.error.message : "無法辨識語音內容。");
                }
            } catch (error) {
                output.innerText = "解析失敗：" + error.message;
            } finally {
                resetMicBtn();
            }
        };
    }

    // 🔄 手動修改原文後重新翻譯
    async function retranslateManual() {
        const API_KEY = document.getElementById("apiKey").value.trim();
        const selectedModel = document.getElementById("modelSelect").value;
        const targetLang = document.getElementById("targetLangSelect").value;
        const modifiedOriginal = document.getElementById("originalText").value.trim();
        const statusLabel = document.getElementById("detectedLang");
        const output = document.getElementById("outputText");

        const langNameMap = { ja: "日文", en: "美式英文", ko: "韓文" };
        const selectedLangName = langNameMap[targetLang];

        if (!modifiedOriginal) {
            alert("原文框內沒有文字！");
            return;
        }

        output.innerText = "重新翻譯中...";

        let promptText = "";
        if (lastDetectedLang === "zh") {
            promptText = `請將以下中文內容翻譯成適合日常旅遊使用的禮貌【${selectedLangName}】。請直接提供翻譯內容，不要包含中文解釋或引號：\n\n${modifiedOriginal}`;
        } else {
            promptText = `請將以下內容翻譯成繁體中文。請直接提供中文翻譯，不要包含任何解釋或引號：\n\n${modifiedOriginal}`;
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${API_KEY}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });

            const data = await response.json();

            if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                lastTranslatedText = data.candidates[0].content.parts[0].text.trim();
                output.innerText = lastTranslatedText;

                const genderTag = lastDetectedGender === "male" ? "👨 男聲" : "👩 女聲";
                if (lastDetectedLang === "zh") {
                    statusLabel.innerText = `修正後【中文 (${genderTag})】 ➔ 譯為${selectedLangName}：`;
                    if (targetLang === 'ja') lastTargetLangCode = 'ja-JP';
                    else if (targetLang === 'en') lastTargetLangCode = 'en-US';
                    else if (targetLang === 'ko') lastTargetLangCode = 'ko-KR';
                    
                    speakText(lastTranslatedText, lastTargetLangCode, lastDetectedGender);
                } else {
                    statusLabel.innerText = `修正後【外語 (${genderTag})】 ➔ 譯為繁體中文：`;
                    lastTargetLangCode = "zh-TW";
                    speakText(lastTranslatedText, "zh-TW", lastDetectedGender);
                }
            } else {
                output.innerText = "翻譯失敗：" + (data.error ? data.error.message : "未知錯誤");
            }
        } catch (error) {
            output.innerText = "連線失敗：" + error.message;
        }
    }

    function resetMicBtn() {
        const micBtn = document.getElementById("micBtn");
        micBtn.classList.remove("recording");
        micBtn.innerText = "🎤 按一下說話（中文與外語皆可）";
    }

    function speakText(text, lang, gender) {
        if (!text) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9;

        if (systemVoices.length === 0) {
            systemVoices = window.speechSynthesis.getVoices();
        }

        const langPrefix = lang.split('-')[0]; 
        const matchedVoice = systemVoices.find(voice => {
            const isLangMatch = voice.lang.toLowerCase().replace('_', '-').startsWith(langPrefix);
            const voiceName = voice.name.toLowerCase();

            if (!isLangMatch) return false;

            if (gender === 'male') {
                return voiceName.includes('male') || voiceName.includes('男') || voiceName.includes('otoya') || voiceName.includes('david') || voiceName.includes('yuna') || voiceName.includes('minsu') || voiceName.includes('tairad');
            } else {
                return voiceName.includes('female') || voiceName.includes('女') || voiceName.includes('kyoko') || voiceName.includes('samantha') || voiceName.includes('zira') || voiceName.includes('yuna') || voiceName.includes('sunhi');
            }
        });

        if (matchedVoice) {
            utterance.voice = matchedVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    function speakResult() {
        if (lastTranslatedText) {
            speakText(lastTranslatedText, lastTargetLangCode, lastDetectedGender);
        }
    }

    function copyResult() {
        if (lastTranslatedText) {
            navigator.clipboard.writeText(lastTranslatedText).then(() => alert("已複製！"));
        }
    }
</script>

</body>
</html>
