<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨身日文翻譯官</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; resize: none; outline: none; }
        textarea:focus { border-color: #007aff; }
        button { width: 100%; padding: 14px; background-color: #007aff; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: background 0.2s; }
        button:active { background-color: #0056b3; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #f9f9fb; border-radius: 10px; border: 1px solid #eee; min-height: 80px; }
        .result-title { font-size: 12px; color: #888; margin-bottom: 5px; }
        .result-text { font-size: 18px; color: #1d1d1f; white-space: pre-wrap; word-break: break-word; }
        .speak-btn { background-color: #34c759; margin-top: 10px; font-size: 14px; padding: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇯🇵 日文翻譯官</h2>
    <textarea id="inputText" placeholder="輸入想說的中文..."></textarea>
    <button onclick="translateText()" id="submitBtn">翻譯成日文</button>

    <div class="result-box">
        <div class="result-title">日文翻譯結果（日常生活禮貌敬語）：</div>
        <div class="result-text" id="outputText">等待翻譯中...</div>
    </div>
    <button class="speak-btn" onclick="speakJapanese()">🔊 發音朗讀</button>
</div>

<script>
    // 1. 填入你的 Gemini API Key
    const API_KEY = "你的_GEMINI_API_KEY_AQ.Ab8RN6L-auDG-iblhqN9hI2tKFV5inS6XHUf0X9CeKAD5-2t0A"; 

    async function translateText() {
        const input = document.getElementById("inputText").value.trim();
        const output = document.getElementById("outputText");
        const btn = document.getElementById("submitBtn");

        if (!input) {
            alert("請先輸入內容！");
            return;
        }

        output.innerText = "翻譯中...";
        btn.disabled = true;

        // 指定使用 Gemini 2.5 Flash 模型
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

        // 系統 Prompt：強制只回應日文禮貌敬語
        const requestBody = {
            contents: [{
                parts: [{
                    text: `請將以下內容翻譯成適合在日本旅遊日常使用的禮貌敬語（丁寧語，如～です、～ます）。請直接提供翻譯結果即可，不需要任何解釋或額外說明：\n\n${input}`
                }]
            }]
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                output.innerText = data.candidates[0].content.parts[0].text.trim();
            } else {
                output.innerText = "翻譯失敗，請檢查 API Key 或網路狀態。";
            }
        } catch (error) {
            output.innerText = "發生錯誤：" + error.message;
        } finally {
            btn.disabled = false;
        }
    }

    // 手機語音朗讀日文
    function speakJapanese() {
        const text = document.getElementById("outputText").innerText;
        if (!text || text === "等待翻譯中..." || text.includes("失敗")) return;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ja-JP";
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
